<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniCape - Animated Minecraft Cape Creator</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Three.js Libraries for 3D Preview -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar Controls -->
        <aside class="sidebar">
            <div class="brand">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <h1>AniCape</h1>
            </div>

            <div class="control-card">
                <h3><i class="fa-solid fa-file-image"></i> GIF / Image Texture</h3>
                <label class="file-drop-area">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span>Choose Animated GIF or PNG</span>
                    <input type="file" id="gifUpload" accept="image/gif, image/png, image/jpeg">
                </label>
            </div>

            <div class="control-card">
                <h3><i class="fa-solid fa-fill-drip"></i> Custom Background & Color</h3>
                <div class="field-group">
                    <label>Base Cape Color</label>
                    <input type="color" id="bgColor" value="#ffffff">
                </div>
                <div class="field-group">
                    <label>Background Image (Optional)</label>
                    <input type="file" id="bgUpload" accept="image/*">
                </div>
            </div>

            <div class="control-card">
                <h3><i class="fa-solid fa-sliders"></i> Resolution & Speed</h3>
                <div class="field-group">
                    <label>Scale / Quality</label>
                    <select id="capeScale">
                        <option value="64">64 x 32 (Standard)</option>
                        <option value="128" selected>128 x 64 (HD Pixelated)</option>
                        <option value="256">256 x 128 (Ultra HD)</option>
                    </select>
                </div>
                <div class="field-group">
                    <label>Animation Frame Delay: <span id="fpsVal">100 ms</span></label>
                    <input type="range" id="animSpeed" min="20" max="300" step="10" value="100">
                </div>
            </div>

            <div class="control-card">
                <h3><i class="fa-solid fa-shirt"></i> Mode & Model View</h3>
                <div class="toggle-group">
                    <label class="switch-label">Show Elytra Mode</label>
                    <input type="checkbox" id="elytraToggle">
                </div>
            </div>

            <button id="downloadBtn" class="btn-primary">
                <i class="fa-solid fa-download"></i> Download Animated Cape Strip (Better Capes)
            </button>
        </aside>

        <!-- Main Workspace -->
        <main class="workspace">
            <div class="preview-header">
                <h2>3D Minecraft Player Preview (Steve Skin)</h2>
                <span class="badge">Drag to rotate • Scroll to zoom</span>
            </div>

            <div id="canvas3dContainer"></div>

            <div class="texture-strip-container">
                <h4>Generated Texture Sequence (Active Canvas)</h4>
                <canvas id="capeCanvas" width="128" height="64"></canvas>
            </div>
        </main>
    </div>


<!-- HTML Scripts Section -->
<script src="js/gif-decoder.js"></script>
<script src="js/gif-handler.js"></script>
<script src="js/cape-generator.js"></script>
<script src="js/cape-exporter.js"></script>
<script src="js/preview-3d.js"></script>
<script src="js/app.js"></script>
</body>
</html>
